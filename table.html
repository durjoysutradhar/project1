<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Html table learning</title>

    <style>
        table{
            border-collapse: collapse;
        }
        th, td{
            border : 1px solid black;
            padding : 10px;
        }
    </style>
</head>
<body>
    <h1> HTML Table learning process</h1>
    <table>
        <caption><b>Employee salary table</b></caption>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Company</th>
                <th>Net Worth</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Bill gates</td>
                <td>Microsoft founder</td>
                <td>1000000000</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Steve Jobs</td>
                <td>Apple founder</td>
                <td>1000000000</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Elon Musk</td>
                <td>Tesla founder</td>
                <td>1000000000</td>
            </tr>
            <tr>
                <td>4</td>
                <td>Mark Zuckerberg</td>
                <td>Facebook founder</td>
                <td>1000000000</td>
            </tr>
        </tbody>
        <tfoot>

        </tfoot>
    </table>
</body>
</html>
